name: tdp
version: 1
description: TDP is Task, Design, Plan — QRSPI reduced to just a design doc and a phased implementation plan
artifacts:
  - id: task
    generates: task.md
    description: |
      Prompt the user to provide the task description.
    instruction: |
      Prompt the user to provide the task description. Before proceeding to the next step, ask the user
      if the created artifact is good.
    template: task.md
  - id: design
    generates: design.md
    description: |
      High-level description of the change — motivation, current state, desired end state, and scope boundaries.
      Depends only on task.md — there is no separate research artifact in this schema, so design absorbs
      the codebase investigation before making design decisions.
    instruction: |
      Investigate the codebase, then synthesize what you find into a clear design document.
      Depends on task.md — derive all sections from the task description and what you discover.

      # Design Discussion Phase

      You are now in the Design Discussion phase. Because this schema has no separate research phase, you
      must first investigate the codebase yourself, then work with the user to make design decisions.

      ## Steps

      1. **Read task.md and any mentioned files immediately and FULLY**:
        - **IMPORTANT**: Use the Read tool WITHOUT limit/offset parameters to read entire files, never read files partially - if a file is mentioned, read it completely
        - do not spawn sub-tasks before reading these files yourself in the main context

      2. **Investigate the current codebase (absorbed research step)**:
        - Spawn parallel sub-agents to understand how the relevant parts of the system work TODAY, before proposing any changes:
          - **codebase-locator**: Find all files related to the task
          - **codebase-analyzer**: Understand how the current implementation works, with file:line references
          - **codebase-pattern-finder**: Find existing patterns and conventions to follow
          - **web-search-researcher**: Research external docs/libraries if relevant, only if needed
        - This investigation must stay objective — document what exists, not what should change
        - Wait for all sub-agents to complete and synthesize their findings before moving on

      3. **Check for related task content**:
        - read all relevant files in the task directory to fully understand the work so far

      4. **Optional - Spawn additional sub-tasks if gaps remain**:
        - If the investigation in step 2 left anything unclear, spawn further **codebase-locator** / **codebase-analyzer** / **codebase-pattern-finder** calls to fill the gap
        - Each agent knows how to find the right files and code patterns, identify conventions, look for integration points and dependencies, and return specific file:line references

      <important if="the user asks you to find how things work or add detail about existing functionality">
        prefer to use an initial pass with one or more Agent() calls before reading files yourself
        <else if="the user gives straightforward feedback that doesn't require loading more codebase context">
            skip Agent() calls if you already have the context
        </else>
      </important>

      5. **Read the design discussion Template**

      `Read({SKILLBASE}/references/design_discussion_template.md)`

      <content_guidance>
      **Outline High-level product spec** - Current state, desired end state, what we're not doing in terms of user experience or functionality

      **Outline the proposed end state architecture** - Before and after diagrams, concise outline, description, psuedocode, etc

      **Discuss design decisions**
        - For each major design choice, present options with pros/cons
        - Make recommendations based on codebase conventions
        - If your investigation surfaced testing patterns for the components being changed, include a brief testing approach (e.g. "follow the existing unit test pattern in `__tests__/foo.test.ts`")

      **IMPORTANT: All design questions must be written in the OPEN state**
        - Put ALL questions under "Design Questions", NOT under "Resolved Design Questions"
        - You may recommend an option, but you must NOT resolve or close a question yourself
        - Only the user can resolve a design question — through explicit feedback or approval
        - The "Resolved Design Questions" section should be empty in the initial document
        - Do NOT auto-resolve questions even if the answer seems obvious from your investigation

      **Resolving questions after user feedback**
        - When the user provides a clear answer (e.g. "for X we should do Y"), move the question to "Resolved Design Questions"
        - They don't need to say "resolve" explicitly — any clear indication of a decision counts
        - Record the final decision with rationale
        - Record the options that were considered but not chosen, with brief rationale for why they were discarded

      **Present patterns to follow**
        - Identify existing patterns in the codebase that should be followed (from your investigation in step 2)
        - Include file locations and multiline code snippets showing the pattern
        - This section is also where the codebase-investigation findings live for the plan phase to reference — be thorough, include file:line citations, since there is no separate research.md or structureOutline.md

      </content_guidance>

      6. **Read the final output template**

      `Read({SKILLBASE}/references/design_discussion_final_answer.md)`

      If hook context says all design questions have been resolved, read the resolved template instead:

      `Read({SKILLBASE}/references/design_discussion_final_answer_resolved.md)`

      7. Respond following the selected template exactly. Do not include a summary or other information. Include cloud permalinks if available.

      <guidance>

      ## Markdown Formatting

      When writing markdown files that contain code blocks showing other markdown (like README examples or SKILL.md templates), use 4 backticks (````) for the outer fence so inner 3-backtick code blocks don't prematurely close it:

      ````markdown
      # Example README
      ## Installation
      ```bash
      npm install example
      ```
      ````

      ## Document Precedence

      When documents conflict, the most recent document wins:
      **design discussion > task**

      Decisions made during the design discussion supersede the original task description.
      The task provides the initial request; the design discussion refines and finalizes the approach.
      </guidance>


      Before proceeding to the next step, ask the user if the created artifact is good.
    template: design.md
    requires:
      - task
  - id: plan
    generates: plan.md
    description: |
      Phased implementation plan with trackable tasks, code examples, and success criteria.
      Depends on task and design. This schema has no separate structureOutline artifact, so plan
      does both the phase-breakdown and the detailed-conversion work in one pass.
    instruction: |
      # Create Plan

      You are in the Plan Writing phase. There is no separate structure-outline artifact in this schema,
      so you must both break the work into phases AND write the detailed implementation for each phase,
      based on the design document.

      ## Steps

      1. **Read all input files FULLY**:
         - Use Read tool WITHOUT limit/offset to read task.md and design.md
         - Understand the current state of the codebase from the "Patterns to follow" and other findings in design.md

      2. **Read relevant code files**:
         - Read any source files mentioned in design.md
         - Build context for writing specific code examples

      3. **Spawn sub-agents for follow-up research if necessary**:

         **For deeper investigation:**
         - **codebase-locator**: Find additional files if needed
         - **codebase-analyzer**: Deep-dive on specific implementations
         - **codebase-pattern-finder**: Find more examples of patterns
         - **web-search-researcher**: Research external best practices

         Do not run agents in the background - FOREGROUND AGENTS ONLY.

      4. **Break the work into phases (absorbed structure-outline step)**:
         - Break the work into logical phases
         - Each phase should be independently testable
         - Order phases vertically rather than horizontally - wire everything together in a testable way and then add functionality incrementally

      Each phase should ideally be a thin vertical slice that touches all / as many layers as possible for the desired end state. Avoid horizontal phases like 'add all types', 'add API endpoints', 'implement UI'.

      Try to find ways to structure phases so each one cuts across multiple layers, services, or module boundaries at least > 1 if at all possible. Each phase should be independently verifiable based on typechecks, tests, build steps, and any other in-repo verification. Ensure you understand codebase patterns for testing and verification, and don't suggest manual testing for a step that could be automated w/ a script, an existing skill, etc.

      A horizontal breakdown looks like this:

      1. Build the schema
      2. Build the API
      3. Build the UI
      4. Add tests

      That creates handoff problems and partially finished work.

      A vertical slice cuts through the stack:

      1. User can create the simplest version of the thing end-to-end
      2. User can edit one field end-to-end
      3. User can see the first validation error end-to-end

      Each issue should include schema, API, UI, and tests if the slice needs them.

      These are intended to be **illustrative**. Not all work lends itself to this type of structure specifically, but you should try to cross module boundaries where able to surface surprises early. Do not structure a phase N such that Phase N+1 must be completed before Phase N can be verified.

      5. **Read the plan template**:

      `Read({SKILLBASE}/references/plan_template.md)`

      6. **Write the implementation plan (absorbed detailed-conversion step)**:
         - Add a checkbox list of all phase titles at the top (Implementation Overview), format `- [ ] Phase N: [Title]`
         - For each phase: overview, specific file changes with descriptions and code examples (not just descriptions), and success criteria split into Automated Verification (runnable commands) and Manual Verification (specific, actionable steps)
         - If design.md documented testing patterns for the components being changed, include test code in the plan (new test files or additions to existing test files), following those patterns

      ## Plan Writing Guidelines

      - Each phase should be independently testable
      - Include specific code examples, not just descriptions
      - Automated verification should be runnable commands
      - Manual verification should be specific, actionable steps
      - Pause for human confirmation between phases
      - Not every phase requires manual validation — don't add manual steps just to have them. If a phase cannot be manually checked, it may be too small or not vertical enough

      ## Document Precedence

      When documents conflict, the most recent document wins:
      **plan > design discussion > task**

      The plan is the final authority. Follow the design decisions over the original task description
      when they differ.

      ## Output

      Before proceeding to the next step, ask the user if the created artifact is good.

      <guidance>
      ## Markdown Formatting

      When writing markdown files that contain code blocks showing other markdown (like README examples or SKILL.md templates), use 4 backticks (````) for the outer fence so inner 3-backtick code blocks don't prematurely close it:

      ````markdown
      # Example README
      ## Installation
      ```bash
      npm install example
      ```
      ````
      </guidance>
    template: plan.md
    requires:
      - task
      - design
apply:
  requires:
    - plan
  tracks: plan.md
  instruction: |
    You are tasked with implementing an approved technical plan. These plans contain phases with specific changes and success criteria.

    ## Getting Started

    When given a plan path:
    - Read the plan completely and check for any existing checkmarks (- [x])
    - Read the original task and all files mentioned in the plan
    - **Read files fully** - never use limit/offset parameters, you need complete context
    - Think deeply about how the pieces fit together
    - Create a todo list to track your progress
    - Start implementing if you understand what needs to be done

    If no plan path provided, ask for one.

    ## Implementation Philosophy

    Plans are carefully designed, but reality can be messy. Your job is to:
    - Follow the plan's intent while adapting to what you find
    - Implement each phase fully before moving to the next
    - Verify your work makes sense in the broader codebase context
    - Update checkboxes in the plan as you complete sections

    When things don't match the plan exactly, think about why and communicate clearly. The plan is your guide, but your judgment matters too.

    If you encounter a mismatch:
    - STOP and think deeply about why the plan can't be followed
    - Present the issue clearly:
      ```
      Issue in Phase [N]:
      Expected: [what the plan says]
      Found: [actual situation]
      Why this matters: [explanation]

      How should I proceed?
      ```

    ## Verification Approach

    After implementing a phase:
    - Run the success criteria checks
    - Fix any issues before proceeding
    - Update your progress in both the plan and your todos
    - Check off completed items in the plan file itself using Edit
    - **Pause for human verification**: After completing all automated verification for a phase, pause and inform the human that the phase is ready for manual testing. Use this format:
      ```
      Phase [N] Complete - Ready for Manual Verification

      Automated verification passed:
      - [List automated checks that passed]

      Please perform the manual verification steps listed in the plan:
      - [List manual verification items from the plan]

      Let me know when manual testing is complete so I can proceed to Phase [N+1].
      ```

    If instructed to execute multiple phases consecutively, skip the pause until the last phase. Otherwise, assume you are just doing one phase.

    Do not check off items in the manual testing steps until confirmed by the user.


    ## If You Get Stuck

    When something isn't working as expected:
    - First, make sure you've read and understood all the relevant code
    - Consider if the codebase has evolved since the plan was written
    - Present the mismatch clearly and ask for guidance

    Use sub-tasks sparingly - mainly for targeted debugging or exploring unfamiliar territory.

    ## Resuming Work

    If the plan has existing checkmarks:
    - Trust that completed work is done
    - Pick up from the first unchecked item
    - Verify previous work only if something seems off

    Remember: You're implementing a solution, not just checking boxes. Keep the end goal in mind and maintain forward momentum.
