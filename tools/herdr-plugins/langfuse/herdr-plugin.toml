id = "local.langfuse"
name = "Langfuse"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Launch local Langfuse via the mise langfuse task (docker compose up -d) and show a Windows notification when up"
platforms = ["windows"]

# Start Langfuse automatically when the Herdr server starts, then notify.
[[startup]]
command = ["pwsh", "-NoProfile", "-File", "start.ps1"]

# Also expose it as a manual action.
[[actions]]
id = "start"
title = "Start Langfuse"
contexts = ["workspace"]
command = ["pwsh", "-NoProfile", "-File", "start.ps1"]
